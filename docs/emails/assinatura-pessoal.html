  ASSINATURA DE E-MAIL — Flamme Rouge

  Para colar no cliente de e-mail (Gmail: Configurações → Assinatura;
  Hostinger/Outlook: equivalente). Cole como HTML, não como texto.

  ---------------------------------------------------------------------------
  DERIVADA DA ASSINATURA VENTUNO, de propósito. A estrutura é a mesma — marca
  à esquerda, régua vertical, dados à direita — porque as duas são do mesmo
  remetente e a familiaridade entre elas é o que faz as duas parecerem sérias.
  O que muda é só o que é identidade: a marca, o acento e o descritivo.

  A MARCA É IMAGEM, O NOME É TEXTO. Cliente de e-mail bloqueia imagem por
  padrão; com o nome em texto a assinatura chega inteira mesmo assim, e a
  bandeirola é o acréscimo que aparece quando as imagens carregam. Mesmo
  raciocínio do e-mail de confirmação.

  O VERMELHO PODE APARECER AQUI. Dentro do produto ele significa uma coisa só
  — alguém precisa de socorro — mas assinatura é material de marca, não
  superfície de operação. É o mesmo lugar que o roxo ocupa na Ventuno.
  ---------------------------------------------------------------------------
